name: release

# Tags v<VERSION> and creates the GitHub release (notes from CHANGELOG.md)
# when VERSION on main names a version that has no tag yet.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check
        run: |
          docker run --rm -v "$PWD:/p" -w /p --entrypoint bash \
            ghcr.io/kopexa-grc/php-apache:8.4-dev bin/check.sh
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already released"; exit 0
          fi
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > /tmp/notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file /tmp/notes.md
          echo "Released v$v" >> "$GITHUB_STEP_SUMMARY"
